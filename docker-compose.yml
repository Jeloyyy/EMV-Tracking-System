version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jag-prereq_app
    container_name: jag_app
    restart: unless-stopped
    working_dir: /var/www
    # no host or named mounts for /var/www so the image's cloned code is used
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=1
    networks:
      - jagnet

  web:
    image: nginx:stable
    container_name: jag_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - jagnet

  db:
    image: mariadb:10.6
    container_name: jag_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - jagnet

  node:
    image: node:18
    container_name: jag_node
    working_dir: /var/www
    command: ["sh", "-c", "npm install && npm run dev"]
    networks:
      - jagnet

volumes:
  dbdata:

networks:
  jagnet:
    driver: bridge
